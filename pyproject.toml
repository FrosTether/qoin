[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qoin-maker"
version = "0.1.0"
description = "Source-available factory for standard EVM tokens (ERC-20) with commercial licensing."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "FrosTether" }]
keywords = ["erc20", "token", "evm", "base", "solidity", "factory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
qoin-maker = "qoin_maker.cli:main"

[project.urls]
Homepage = "https://github.com/FrosTether/qoin"
License = "https://github.com/FrosTether/qoin/blob/main/LICENSE"
Commercial = "https://github.com/FrosTether/qoin/blob/main/COMMERCIAL_LICENSE.md"

[tool.setuptools.packages.find]
where = ["src"]
